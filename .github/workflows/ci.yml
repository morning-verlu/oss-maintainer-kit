name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build
        run: npm run build
      - name: Verify offline examples
        run: |
          node dist/cli.js triage --issue examples/issue.md --offline
          node dist/cli.js review --diff examples/pr.patch --offline
          node dist/cli.js release-notes --commits examples/commits.txt --offline

  local-action:
    name: Local action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Run checked-out action
        uses: ./
        with:
          command: review
          file: examples/pr.patch
          offline: "true"
