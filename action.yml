name: oss-maintainer-kit
description: Issue triage, pull request review, and release notes for open-source maintainers.

inputs:
  command:
    description: "Command to run: triage, review, or release-notes."
    required: true
    default: review
  file:
    description: Path to the issue, diff, or commit list file.
    required: true
  model:
    description: OpenAI model to use.
    required: false
    default: gpt-5.4-mini
  openai-api-key:
    description: OpenAI API key. If omitted, the action uses offline heuristics.
    required: false
  offline:
    description: Force offline mode.
    required: false
    default: "false"
  max-bytes:
    description: Maximum input size.
    required: false
    default: "180000"

runs:
  using: composite
  steps:
    - name: Build oss-maintainer-kit
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build
    - name: Run maintainer task
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_MAX_BYTES: ${{ inputs.max-bytes }}
      run: node "${{ github.action_path }}/dist/action.js"
